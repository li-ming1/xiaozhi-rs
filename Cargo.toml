[package]
name = "xiaozhi-rs"
version = "0.1.0"
edition = "2021"
description = "小智客户端 - Rust 极简实现"

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }

# WebSocket（rustls 纯 Rust TLS，无需系统 OpenSSL）
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# HTTP 客户端（OTA/激活）— rustls-no-provider + 手动安装 ring，避免 aws-lc-rs 的 cmake/NASM 依赖
reqwest = { version = "0.13", features = ["json", "rustls-no-provider"], default-features = false }
# rustls 直接依赖：为 reqwest 的 rustls-no-provider 安装 ring crypto provider
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# 日志
log = "0.4"
env_logger = "0.11"

# CLI
clap = { version = "4", features = ["derive"] }

# 错误处理
anyhow = "1"

# 目录
directories = "6"

# 加密
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"

# 主机名
hostname = "0.4"

# HTTP（WebSocket Headers）
http = "1"
tungstenite = "0.30"

# 音频
cpal = "0.18"

# Opus 编解码（使用 libloading 加载预编译库）
libloading = "0.9"

[profile.release]
# 本项目音频 DSP（重采样/Opus）为计算密集型，整体提至 3；依赖库仍优化体积
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = "z"