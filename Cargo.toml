[package]
name = "xiaozhi-rs"
version = "0.1.2"
edition = "2024"
description = "小智客户端 - Rust 极简实现"
license = "MIT"
readme = "README.md"

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util", "signal"] }

# WebSocket（rustls 纯 Rust TLS，无需系统 OpenSSL）
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# 仅用 split/SinkExt/StreamExt：关闭默认 features 精简编译
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# HTTP 客户端（OTA/激活）— ureq 轻量替代 reqwest，共享 rustls/ring，纯 Rust 跨平台
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# rustls 直接依赖：为 tokio-tungstenite 安装 ring crypto provider（避免 aws-lc-rs 的 cmake/NASM 依赖）
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# 日志（手写极简 logger，见 main.rs，替代 env_logger）
log = "0.4"

# 错误处理
anyhow = "1"

# 目录
directories = "6"

# 加密（hex 编码为 ~8 行手写实现，见 identity.rs）
sha2 = "0.11"
hmac = "0.13"

# 主机名
hostname = "0.4"

# HTTP（WebSocket Headers）
http = "1"
tungstenite = "0.30"

# 音频
cpal = "0.18"

# Opus 编解码（使用 libloading 加载预编译库）
libloading = "0.9"

[profile.release]
# 本项目音频 DSP（重采样/Opus）为计算密集型，整体提至 3；依赖库仍优化体积
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = "z"