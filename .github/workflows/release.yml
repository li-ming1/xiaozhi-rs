name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - { os: windows-latest,  target: x86_64-pc-windows-msvc,   name: windows-x64,   exe: xiaozhi-rs.exe }
          - { os: windows-latest,  target: aarch64-pc-windows-msvc,  name: windows-arm64, exe: xiaozhi-rs.exe }
          # macOS（macos-13 Intel runner 已于 2025-12-04 退役；统一用 arm64 runner，
          # x64 产物经 Rust 架构间交叉编译生成，x86_64-apple-darwin 无需额外工具链）
          - { os: macos-latest,    target: x86_64-apple-darwin,      name: macos-x64,     exe: xiaozhi-rs }
          - { os: macos-latest,    target: aarch64-apple-darwin,     name: macos-arm64,   exe: xiaozhi-rs }
          # Linux（ubuntu-24.04-arm = 原生 ARM64 runner，无需交叉编译）
          - { os: ubuntu-latest,   target: x86_64-unknown-linux-gnu,  name: linux-x64,     exe: xiaozhi-rs }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64,  exe: xiaozhi-rs }

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # opusic-sys（bundled）构建期用 cmake 编译 libopus。
      # 显式安装统一最新版，避免依赖 runner 预装版本（各平台不一致且可能过旧）。
      - name: Install cmake
        uses: lukka/get-cmake@latest

      # ── Linux: 安装 ALSA 开发库（cpal 依赖）──
      - name: Install ALSA dev
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # ── 打包：可执行文件（Opus 已由 opusic-sys 静态内置，无需再分发 opus 库）──
      - name: Package
        shell: bash
        run: |
          STAGE="dist/xiaozhi-rs-${{ matrix.name }}"
          mkdir -p "$STAGE"
          # 可执行文件
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "$STAGE/"
          # 文档
          cp README.md LICENSE "$STAGE/"

      - name: Archive (Windows zip)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/xiaozhi-rs-${{ matrix.name }}/* -DestinationPath dist/xiaozhi-rs-${{ matrix.name }}.zip

      - name: Archive (Unix tar.gz)
        if: runner.os != 'Windows'
        run: tar -czf dist/xiaozhi-rs-${{ matrix.name }}.tar.gz -C dist xiaozhi-rs-${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-rs-${{ matrix.name }}
          path: dist/xiaozhi-rs-${{ matrix.name }}.*

  # ── Tag 推送时创建 GitHub Release ──
  # 独立 job，等全部平台构建完成后再发布一次，
  # 避免多 job 并行抢建同一 Release 引发 "Too many retries"。
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
